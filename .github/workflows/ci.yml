name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # A scratch Redis for the shared-store live tests (tests/test_live_redis.py)
    # and the middleware ones that wait on Redis.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      EASY_MCP_LIVE_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check easy_mcp tests
      - name: Type check
        run: mypy easy_mcp
      - name: Test
        run: pytest -q

  test-without-otel:
    # The default install has no [otel] extra, so opentelemetry cannot be
    # imported and a server built without metrics=True records nothing.
    # The [dev] extra brings OpenTelemetry in for the tracing tests; this
    # job takes it out again, as mypy and the suite must pass both ways.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install, then remove OpenTelemetry
        run: |
          pip install -e .[dev]
          pip uninstall -y opentelemetry-sdk opentelemetry-api opentelemetry-semantic-conventions prometheus-client
      - name: Import without OpenTelemetry
        # load_bridge() is None only when opentelemetry-api cannot be used.
        run: >-
          python -c "import easy_mcp;
          from easy_mcp.telemetry._otel import load_bridge;
          assert load_bridge() is None"
      - name: Type check
        run: mypy easy_mcp
      - name: Test
        run: pytest -q

  publish:
    # Runs only on version tags (e.g. v0.1.0) after tests pass.
    # Uses PyPI Trusted Publishing — configure the publisher on pypi.org
    # first; no API token secret is needed.
    needs: [test, test-without-otel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
