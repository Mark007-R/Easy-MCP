[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "easy-mcp-kit"
dynamic = ["version"]
description = "Build secure MCP (Model Context Protocol) servers from plain Python functions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Rodrigues", email = "markrodrigues2004@gmail.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai",
    "agents",
    "llm",
    "tools",
    "server",
    "streamable-http",
    "sse",
    "oauth",
    "redis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mongodb = ["pymongo>=4.6"]
pydantic = ["pydantic>=2.0"]
# Local verification of JWT access tokens; token introspection needs nothing.
oauth = ["pyjwt[crypto]>=2.15.0"]
# RedisStore: sessions and limits shared between workers.  5.0.1 is the first
# release with aclose() and after the fixes for connections left unread by a
# cancelled command, which disconnects routinely cause here.
redis = ["redis>=5.0.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pymongo>=4.6",  # bson, for the MongoDB connector's Extended JSON tests
    "pyjwt[crypto]>=2.15.0",  # the OAuth tests sign their own tokens
    "redis>=5.0.1",  # RedisStore's unit tests; its live tests need a server too
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
easy-mcp = "easy_mcp.cli:main"
easy-mcp-github = "easy_mcp.connectors.github:main"
easy-mcp-postgres = "easy_mcp.connectors.postgres:main"
easy-mcp-mysql = "easy_mcp.connectors.mysql:main"
easy-mcp-mongodb = "easy_mcp.connectors.mongodb:main"
easy-mcp-sqlite = "easy_mcp.connectors.sqlite:main"

[project.urls]
Homepage = "https://github.com/Mark007-R/Easy-MCP"
Repository = "https://github.com/Mark007-R/Easy-MCP"
Issues = "https://github.com/Mark007-R/Easy-MCP/issues"
Security = "https://github.com/Mark007-R/Easy-MCP/blob/main/SECURITY.md"

[tool.hatch.version]
path = "easy_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["easy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Optional drivers behind the [postgres], [mysql], [mongodb] and [redis]
# extras; the connectors and RedisStore import them lazily.
module = ["psycopg", "pymysql", "pymongo", "pymongo.*", "bson", "bson.*", "redis", "redis.*"]
ignore_missing_imports = true
